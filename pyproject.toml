[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-world-mobility-edge"
version = "0.3.0"
description = "Numerical experiments on localization and mobility edges in sparse random graph spectra."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.7",
  "networkx>=3.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
reports = ["python-docx>=1.1"]
dev = ["build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]
