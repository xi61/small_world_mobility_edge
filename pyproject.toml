[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-world-mobility-edge"
version = "0.2.0"
description = "Numerical experiments on localization and mobility edges in sparse random graph spectra."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib",
  "networkx",
  "numpy",
  "pandas",
  "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]
